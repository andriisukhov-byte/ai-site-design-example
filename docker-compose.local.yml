name: acme-local

services:
  npm-deps:
    image: node:22-bookworm-slim
    profiles: [setup]
    working_dir: /app
    command: npm ci
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - cms-node-modules:/app/apps/cms/node_modules
      - web-node-modules:/app/apps/web/node_modules
    networks: [acme]

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app/apps/web
    command: node /app/node_modules/astro/bin/astro.mjs dev --host 0.0.0.0 --force
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      PAYLOAD_API_URL: http://cms:3000/api
      PAYLOAD_API_REQUIRED: 'true'
      PUBLIC_MEDIA_BASE_URL: ''
      CONTENT_CACHE_TTL_MS: 15000
      PUBLIC_FORM_ENDPOINT_CONTACT: ${PUBLIC_FORM_ENDPOINT_CONTACT:-}
      PUBLIC_FORM_ENDPOINT_ENTERPRISE: ${PUBLIC_FORM_ENDPOINT_ENTERPRISE:-}
      PUBLIC_FORM_ENDPOINT_BLOG_SUBSCRIBE: ${PUBLIC_FORM_ENDPOINT_BLOG_SUBSCRIBE:-}
      PUBLIC_FORM_ENDPOINT_REQUEST_DEMO: ${PUBLIC_FORM_ENDPOINT_REQUEST_DEMO:-}
    ports:
      - '4321:4321'
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - cms-node-modules:/app/apps/cms/node_modules
      - web-node-modules:/app/apps/web/node_modules
    depends_on:
      cms:
        condition: service_started
    networks: [acme]

  cms-init:
    image: node:22-bookworm-slim
    profiles: [setup]
    working_dir: /app
    command: npm run predev --workspace @acme/cms
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-acme}:${POSTGRES_PASSWORD:-acme_local_password}@postgres:5432/${POSTGRES_DB:-acme}
      PAYLOAD_DB_PUSH: 'true'
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env.docker}
      PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3000
      MEDIA_STORAGE_DIR: /app/apps/web/public/media
      MEDIA_PUBLIC_BASE_URL: http://localhost:4321
      PAYLOAD_MCP_DISABLED: 'true'
      FRONTEND_DEPLOY_HOOK_URL: ''
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - cms-node-modules:/app/apps/cms/node_modules
      - web-node-modules:/app/apps/web/node_modules
      - cms-next:/app/apps/cms/.next
    networks: [acme]

  cms:
    image: node:22-bookworm-slim
    working_dir: /app
    command: npm run dev --workspace @acme/cms
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-acme}:${POSTGRES_PASSWORD:-acme_local_password}@postgres:5432/${POSTGRES_DB:-acme}
      PAYLOAD_DB_PUSH: 'false'
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env.docker}
      PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3000
      MEDIA_STORAGE_DIR: /app/apps/web/public/media
      MEDIA_PUBLIC_BASE_URL: http://localhost:4321
      PAYLOAD_MCP_DISABLED: 'true'
      FRONTEND_DEPLOY_HOOK_URL: ''
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - cms-node-modules:/app/apps/cms/node_modules
      - web-node-modules:/app/apps/web/node_modules
      - cms-next:/app/apps/cms/.next
    networks: [acme]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acme}
      POSTGRES_USER: ${POSTGRES_USER:-acme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acme_local_password}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks: [acme]

networks:
  acme:

volumes:
  postgres-data:
  node-modules:
  cms-node-modules:
  web-node-modules:
  cms-next:
